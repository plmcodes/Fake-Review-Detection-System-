# Model D, joint regime: encoder + decoder + MLP fine-tuned together, loss = BCE + lambda * recon
model:
  name: hybrid_joint
  runner: hybrid
  classifier: mlp
  regime: joint
  features: {latent: true, recon_error: true, style: true, behaviour: auto}
  oof_folds: 0
  ae: {latent_dim: 32, hidden: [256, 64], dropout: 0.2, standardize: true}
  ae_train: {epochs: 200, batch_size: 128, lr: 0.001, patience: 10}
  mlp: {hidden: [64, 32], dropout: 0.3}
  lambda_recon: 0.5
  joint_lr: 0.0003
train: {epochs: 100, batch_size: 128, lr: 0.001, patience: 8}
