# Model D - hybrid (proposed): AE latent z + reconstruction error + style (+ behaviour on Yelp) -> MLP
model:
  name: hybrid
  runner: hybrid
  classifier: mlp        # mlp | xgb
  regime: frozen         # frozen | joint
  features:              # switch groups off for the ablation study
    latent: true
    recon_error: true
    style: true
    behaviour: auto      # auto = only when the dataset has reviewer metadata (Yelp)
  oof_folds: 5           # out-of-fold recon errors for genuine train rows (0/1 = off)
  ae:                    # inner autoencoder = Model A settings
    latent_dim: 32
    hidden: [256, 64]
    dropout: 0.2
    standardize: true
  ae_train: {epochs: 200, batch_size: 128, lr: 0.001, patience: 10}
  mlp: {hidden: [64, 32], dropout: 0.3}
  xgb: {n_estimators: 600, max_depth: 4, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, early_stopping_rounds: 40}
  lambda_recon: 0.5      # joint regime only
  joint_lr: 0.0003       # joint regime only
train: {epochs: 200, batch_size: 128, lr: 0.001, patience: 10}
