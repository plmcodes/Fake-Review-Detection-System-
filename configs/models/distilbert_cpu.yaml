# DistilBERT reduced for a CPU-only laptop: shorter inputs, stratified 2,000-review training subset.
# Reported as its own row ("distilbert_cpu") so it is never confused with the full GPU run.
model:
  name: distilbert_cpu
  runner: transformer
  pretrained: distilbert-base-uncased
  max_len: 128
  batch_size: 16
  eval_batch_size: 64
  epochs: 2
  lr: 0.00003
  max_train: 2000
